name: CI

on:
  pull_request:
    # The shell's own workflow gates app/; main has no required checks, so a skipped run blocks nothing.
    paths-ignore: ['app/**', 'docs/**', '**/*.md']

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm ci --prefix tools/validate
      - run: npm run typecheck
      - run: npm run lint
      - run: npx tsx tools/validate/index.ts items/johnny
      - run: npx tsx tools/validate/index.ts items/blank
      - run: npx tsx tools/validate/index.ts items/overkall
      - run: npx tsx tools/validate/index.ts items/somnlos
      - run: npx vitest run
      - run: npm run build
