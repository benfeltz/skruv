name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm ci --prefix tools/validate
      - run: npm run typecheck
      - run: npx tsx tools/validate/index.ts items/johnny
      - run: npx vitest run
      - run: npm run build
