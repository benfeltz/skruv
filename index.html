<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <title>Skruv</title>
    <!-- Home-screen install: standalone, no browser chrome fighting the game's gestures.
         Manifest only — no service worker. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icon-180.png" />
    <meta name="theme-color" content="#1b1d22" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Skruv" />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #1b1d22;
        overscroll-behavior: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
      }
      #app {
        position: fixed;
        inset: 0;
      }
      #app canvas {
        display: block;
        width: 100%;
        height: 100%;
        touch-action: none;
      }
      /* The pre-splash: the catalog open on its cover, drawn before any script runs so a
         cold load never shows the bare void. It mirrors src/ui/booklet.ts's page look (the
         catalog's: the page alone, centred over the room, with a soft shadow) and the cover
         page of src/scene/catalogPages.ts, its › printed in the corner (the wire-drawn room
         joins it when the real sheet takes over); main.ts removes it on that sheet's first
         paint. test/splashConventions.test.ts pins these values to src/constants.ts. */
      .pre-splash {
        position: fixed;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        width: min(calc(100vw - 24px), 720px, calc(92dvh * 720 / 1000));
        pointer-events: none;
      }
      /* The page canvas's own fit: its 720 × 1000 shrunk to the element's width (an svg's
         width and height don't shrink as a canvas's do). */
      .pre-splash svg {
        display: block;
        width: 100%;
        height: auto;
        aspect-ratio: 720 / 1000;
        border-radius: 6px;
        background: #ffffff;
        box-shadow: 0 12px 40px #0008;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <section class="pre-splash" id="pre-splash" aria-hidden="true">
      <svg viewBox="0 0 720 1000" fill="#1c1c1c" font-family='system-ui, -apple-system, "Segoe UI", sans-serif'>
        <text x="44" y="168.8" font-size="156" font-weight="800">SKRUV</text>
        <text x="50" y="216.8" font-size="30" font-weight="600">Catalog</text>
        <path d="M613 882 L639 904 L613 926" fill="none" stroke="#1c1c1c" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />
      </svg>
    </section>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
